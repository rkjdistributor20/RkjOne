<!doctype html>
<html lang="ms">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://rkj-one.vercel.app; style-src 'unsafe-inline'; img-src 'self' data:;" />
    <title>RKJ One Staff</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f1e7;
        color: #14120f;
      }

      body {
        align-items: center;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }

      main {
        background: #fff;
        border: 1px solid #eadfca;
        border-radius: 8px;
        box-shadow: 0 22px 60px rgba(184, 135, 26, 0.16);
        max-width: 420px;
        padding: 28px;
        text-align: center;
        width: 100%;
      }

      h1 {
        font-size: 24px;
        margin: 0 0 10px;
      }

      p {
        color: #6b6257;
        font-size: 15px;
        line-height: 1.6;
        margin: 0 0 22px;
      }

      a {
        align-items: center;
        background: #e9b127;
        border-radius: 8px;
        color: #111;
        display: inline-flex;
        font-weight: 700;
        height: 44px;
        justify-content: center;
        text-decoration: none;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>RKJ One Staff</h1>
      <p>Sambungan aplikasi sedang dimuat semula. Pastikan internet aktif untuk log masuk.</p>
      <a href="https://rkj-one.vercel.app/login?source=android-fallback">Log Masuk</a>
    </main>
  </body>
</html>
